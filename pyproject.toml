[project]
name = "sales-agent"
version = "0.1.0"
description = "AI sales agent for social-commerce shops: answers Messenger, Instagram, WhatsApp and website chat, and takes orders."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "asgi-lifespan>=2.1.0",
    "anyio>=4.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = [
    "B008",  # FastAPI uses function calls (Depends) in argument defaults
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S105", "S106"]
