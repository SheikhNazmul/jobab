<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chat</title>
<style>
  :root { --brand: #0C6B4D; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", Roboto, system-ui, -apple-system, "Noto Sans Bengali", sans-serif;
    display: flex; flex-direction: column; background: #f5f6f8; color: #14181f;
  }
  header {
    background: var(--brand); color: #fff; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; flex: none;
  }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #58e08b; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header p { margin: 1px 0 0; font-size: 11.5px; opacity: .85; }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; padding: 9px 12px; border-radius: 14px; font-size: 14px;
    line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .in { align-self: flex-start; background: #fff; border: 1px solid #e7e9ee;
    border-bottom-left-radius: 4px; }
  .out { align-self: flex-end; background: var(--brand); color: #fff;
    border-bottom-right-radius: 4px; }
  .meta { align-self: center; font-size: 11px; color: #8a94a6; padding: 2px 0; }
  .typing { align-self: flex-start; color: #8a94a6; font-size: 13px; padding: 4px 6px; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e7e9ee; background: #fff;
    flex: none; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  input {
    flex: 1; border: 1px solid #d7dbe3; border-radius: 10px; padding: 10px 12px;
    font-size: 14px; outline: none; font-family: inherit;
  }
  input:focus { border-color: var(--brand); }
  button {
    border: none; background: var(--brand); color: #fff; border-radius: 10px;
    padding: 0 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  footer { text-align: center; font-size: 10.5px; color: #9aa3b2; padding: 5px; background: #fff; }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <div><h1 id="title">Chat</h1><p id="subtitle">Typically replies in a few minutes</p></div>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input id="text" placeholder="Type your message…" maxlength="4000" aria-label="Message" />
    <button id="send" type="submit">Send</button>
  </form>
  <footer>Powered by Jobab</footer>
  <script src="/widget/frame.js"></script>
</body>
</html>
