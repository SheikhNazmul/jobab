<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jobab Dashboard</title>
<style>
  :root {
    --brand: #0C6B4D; --brand-ink: #0a5540; --bg: #f4f6f8; --panel: #ffffff;
    --line: #e5e8ee; --ink: #1a2230; --muted: #6b7686; --soft: #9aa4b2;
    --ok: #137a4d; --warn: #b4690e; --bad: #c0392b; --chip: #eef1f5;
    --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.05);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5;
  }
  a { color: var(--brand); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }
  #app { height: 100%; }
  .hidden { display: none !important; }

  /* Login */
  .auth { min-height: 100%; display: grid; place-items: center; padding: 20px; }
  .auth-card { width: 360px; max-width: 100%; background: var(--panel); border-radius: 16px;
    box-shadow: var(--shadow); padding: 28px; }
  .auth-card h1 { margin: 0 0 4px; font-size: 22px; }
  .auth-card p.sub { margin: 0 0 18px; color: var(--muted); }
  .brandmark { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; font-weight: 700;
    font-size: 18px; }
  .brandmark .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--brand);
    color: #fff; display: grid; place-items: center; font-size: 17px; }

  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px;
    font-weight: 500; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px;
    background: #fff; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); }
  .field input[type=checkbox] { width: auto; }
  .btn { background: var(--brand); color: #fff; border: none; border-radius: 9px;
    padding: 10px 16px; font-weight: 600; }
  .btn:hover { background: var(--brand-ink); }
  .btn.sm { padding: 6px 11px; font-size: 13px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover { background: var(--chip); }
  .btn.danger { background: var(--bad); }
  .btn:disabled { opacity: .55; }
  .btn.block { width: 100%; }
  .err { color: var(--bad); font-size: 13px; margin: 8px 0 0; min-height: 18px; }
  .link { background: none; border: none; color: var(--brand); padding: 0; font-size: 13px; }

  /* Shell */
  .shell { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
  .side { background: #0f1c24; color: #c6d2da; display: flex; flex-direction: column; padding: 14px 10px; }
  .side .brandmark { color: #fff; padding: 6px 8px 16px; }
  .side nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .side nav button { display: flex; align-items: center; gap: 10px; background: none; border: none;
    color: #aeb9c4; padding: 9px 11px; border-radius: 8px; text-align: left; font-size: 13.5px;
    width: 100%; }
  .side nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
  .side nav button.active { background: var(--brand); color: #fff; }
  .side nav button .count { margin-left: auto; background: rgba(255,255,255,.18); color: #fff;
    border-radius: 20px; font-size: 11px; padding: 1px 7px; }
  .side .who { border-top: 1px solid rgba(255,255,255,.1); padding: 12px 8px 4px; font-size: 12px; }
  .side .who b { color: #fff; display: block; }
  .main { overflow-y: auto; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 22px; position: sticky;
    top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5; }
  .topbar h2 { margin: 0; font-size: 18px; flex: 1; }
  .credits { font-size: 12.5px; color: var(--muted); }
  .credits b { color: var(--ink); }
  .view { padding: 22px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 15px 16px; box-shadow: var(--shadow); }
  .tile .k { color: var(--muted); font-size: 12.5px; }
  .tile .v { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .tile .v small { font-size: 14px; color: var(--muted); font-weight: 500; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-top: 18px; overflow: hidden; }
  .card h3 { margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .card .body { padding: 16px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line);
    font-size: 13.5px; vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase;
    letter-spacing: .02em; }
  tr:last-child td { border-bottom: none; }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px;
    background: var(--chip); color: var(--muted); font-weight: 500; }
  .tag.ok { background: #e4f4ec; color: var(--ok); }
  .tag.warn { background: #fbefdc; color: var(--warn); }
  .tag.bad { background: #fbe6e3; color: var(--bad); }
  .tag.ai { background: #e9ecfb; color: #4150c0; }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .toolbar input[type=search], .toolbar select { padding: 8px 11px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .empty { padding: 36px; text-align: center; color: var(--soft); }

  /* Inbox */
  .inbox { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 56px); }
  .convos { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .convo { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .convo:hover { background: var(--bg); }
  .convo.active { background: #eef5f2; }
  .convo .row1 { display: flex; align-items: center; gap: 7px; }
  .convo .name { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .convo .prev { color: var(--muted); font-size: 12.5px; margin-top: 2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .convo .unread { background: var(--brand); color: #fff; border-radius: 20px; font-size: 11px;
    padding: 0 6px; }
  .thread { display: flex; flex-direction: column; height: 100%; background: var(--bg); }
  .thread-head { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 10px; }
  .thread-head .name { font-weight: 600; flex: 1; }
  .thread-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column;
    gap: 8px; }
  .bubble { max-width: 70%; padding: 9px 13px; border-radius: 14px; font-size: 14px;
    white-space: pre-wrap; word-wrap: break-word; }
  .bubble.in { align-self: flex-start; background: #fff; border: 1px solid var(--line);
    border-bottom-left-radius: 4px; }
  .bubble.out { align-self: flex-end; background: var(--brand); color: #fff;
    border-bottom-right-radius: 4px; }
  .bubble.ai { background: #eef0fb; color: #27306a; border: 1px solid #dfe3f7; align-self: flex-end;
    border-bottom-right-radius: 4px; }
  .bubble .who { font-size: 10.5px; opacity: .75; margin-bottom: 2px; }
  .thread-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line);
    background: var(--panel); }
  .thread-form input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,22,32,.45); display: grid;
    place-items: center; z-index: 50; padding: 20px; }
  .modal { background: var(--panel); border-radius: 14px; width: 520px; max-width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal h3 { margin: 0; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .modal .body { padding: 20px; }
  .modal .foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex;
    justify-content: flex-end; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #15202b; color: #fff; padding: 10px 18px; border-radius: 10px; z-index: 100;
    box-shadow: var(--shadow); font-size: 13.5px; }
  .toast.bad { background: var(--bad); }

  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; }
    .side { display: none; }
    .inbox { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div id="app"><div class="auth"><p class="muted">Loading…</p></div></div>
  <script src="/app/app.js"></script>
</body>
</html>
